stages:
  - test
  - build
  - terraform

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  ECR_REGISTRY: "123456789012.dkr.ecr.us-east-1.amazonaws.com"
  IMAGE_NAME: "pdf-service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# 1. Test Stage: Run Gradle Unit and Integration Tests
gradle-test:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  script:
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  artifacts:
    reports:
      junit:
        - build/test-results/test/TEST-*.xml

# 2. Build Stage: Package and push container image to AWS ECR
docker-build-push:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - apk add --no-cache aws-cli
    # Mocking ECR login - in production this would use IAM Roles/OIDC
    # - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $ECR_REGISTRY/$IMAGE_NAME:latest .
    # - docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    # - docker push $ECR_REGISTRY/$IMAGE_NAME:latest
  only:
    - main

# 3. Terraform Stage: Lint, Validate and Dry-run plan
terraform-plan:
  stage: terraform
  image: hashicorp/terraform:1.7.0
  before_script:
    - cd terraform
    - terraform init -backend=false
  script:
    - terraform validate
    - terraform plan
  only:
    - merge_requests
    - main
