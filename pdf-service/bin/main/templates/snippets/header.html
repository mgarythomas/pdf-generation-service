<div th:fragment="header(title)">
    <div style="border-bottom: 2px solid #1a365d; padding-bottom: 10px; margin-bottom: 20px;">
        <table style="width: 100%; border-collapse: collapse; border: 0;">
            <tr>
                <td style="font-family: 'Liberation Sans', sans-serif; font-size: 20px; font-weight: bold; color: #1a365d;">
                    REGULATORY COMPLIANCE SYSTEM
                </td>
                <td style="font-family: 'Liberation Sans', sans-serif; font-size: 12px; text-align: right; color: #718096; vertical-align: bottom;">
                    Document ID: <span th:text="${jobId}">MOCK-UUID</span>
                </td>
            </tr>
        </table>
    </div>
</div>
